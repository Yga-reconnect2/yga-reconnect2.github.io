<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O Eski Güzel Şarkılar · YGA</title>
<meta name="description" content="YGA deyince aklına gelen şarkı hangisi?">
<meta property="og:title" content="O Eski Güzel Şarkılar · YGA">
<meta property="og:description" content="YGA deyince aklına gelen şarkı hangisi?">
<meta property="og:image" content="https://yga-reconnect2.github.io/sarki/poster.jpg">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --turuncu:#e86018; --kahve:#34221c; --krem:#f6f0e4; --zemin:#120c09; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--zemin); color:var(--krem); font-family:Inter,system-ui,sans-serif; }
  main { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; gap:14px; }
  .sahne { position:relative; width:min(100%, calc((100vh - 120px) * 16 / 9), 1100px); aspect-ratio:16/9; container-type:inline-size;
           background:#000; border-radius:10px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  video { position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:cover; }
  .basla { position:absolute; inset:0; border:0; padding:0; cursor:pointer; background:#000 url(poster.jpg) center/cover; }
  .basla::after { content:""; position:absolute; inset:0; background:radial-gradient(circle at 50% 55%, rgba(0,0,0,.15), rgba(0,0,0,.6)); }
  .basla span { position:absolute; z-index:1; left:50%; top:55%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:.6em;
                background:var(--turuncu); color:#fff; font:600 clamp(15px,2.2cqw,22px) Inter,sans-serif; padding:.8em 1.4em; border-radius:999px;
                box-shadow:0 8px 30px rgba(232,96,24,.5); }
  .basla small { position:absolute; z-index:1; left:0; right:0; bottom:6%; text-align:center; font-size:clamp(12px,1.5cqw,15px); opacity:.85; }
  /* Kart üstündeki gerçek cevap kutusu: videodaki kutunun yerine birebir oturur (1280x720'de 250,420 - 1030,500). */
  .cevap { position:absolute; left:19.53%; top:58.33%; width:60.94%; height:11.11%; display:none; }
  .cevap input { width:100%; height:100%; border:3px solid #c8aa8c; border-radius:1.1cqw; background:#fffcf5; color:var(--kahve);
                 font:700 3.4cqw Caveat,cursive; padding:0 1.9cqw; outline:none; }
  .cevap input:focus { border-color:var(--turuncu); box-shadow:0 0 0 .4cqw rgba(232,96,24,.25); }
  .gonder { position:absolute; right:19.53%; top:71.2%; height:7.2%; display:none; border:0; border-radius:999px; cursor:pointer;
            background:var(--turuncu); color:#fff; font:600 1.7cqw Inter,sans-serif; padding:0 2.4cqw; }
  .gonder:disabled { opacity:.6; cursor:default; }
  .durum { position:absolute; left:19.53%; top:84.5%; max-width:60.94%; font:700 2.6cqw Caveat,cursive; color:#fff; background:rgba(232,96,24,.92); padding:.3cqw 1.6cqw; border-radius:999px; display:none; }
  .durum.hata { background:rgba(179,38,30,.95); }
  .sahne.soru .cevap, .sahne.soru .gonder { display:block; }
  /* Dar ekran: form videonun altına, normal boyutta (iOS yakınlaştırmasın diye 16px+) */
  #altForm { display:none; width:min(100%,520px); flex-direction:column; gap:10px; }
  #altForm.acik { display:flex; }
  #altForm p { margin:0; font:700 26px/1.15 Caveat,cursive; color:var(--krem); text-align:center; }
  #altForm .cevap, #altForm .gonder, #altForm .durum { position:static; display:block; width:100%; height:auto; left:auto; right:auto; top:auto; max-width:none; }
  #altForm .cevap input { height:52px; font-size:26px; border-radius:12px; padding:0 14px; }
  #altForm .gonder { height:48px; font-size:17px; padding:0 20px; }
  #altForm .durum { font-size:22px; text-align:center; padding:6px 14px; }
  #altForm .durum:empty { display:none; }
  .alt { display:flex; gap:18px; align-items:center; font-size:13px; opacity:.75; flex-wrap:wrap; justify-content:center; }
  .alt button { background:none; border:0; color:var(--krem); text-decoration:underline; cursor:pointer; font:inherit; padding:4px; }
  .alt button[hidden] { display:none; }
</style>
</head>
<body>
<main>
  <div class="sahne" id="sahne">
    <video id="video" src="video.mp4" playsinline preload="metadata" poster="poster.jpg"></video>
    <button class="basla" id="basla" aria-label="Videoyu sesli başlat"><span>▶ Sesi aç, izle</span><small>Kulaklıkla daha güzel</small></button>
    <div class="cevap"><input id="sarki" maxlength="300" autocomplete="off" placeholder="Şarkının adını yaz…" aria-label="YGA deyince aklına gelen şarkı"></div>
    <button class="gonder" id="gonder">Gönder</button>
    <div class="durum" id="durum" role="status"></div>
  </div>
  <div id="altForm"><p>Peki senin YGA deyince aklına gelen şarkı-şarkılar var mı?</p></div>
  <div class="alt">
    <button id="atla" hidden>Soruya geç</button>
    <button id="sesKapa" hidden>Müziği durdur</button>
    <span>Reconnect with YGA</span>
  </div>
</main>
<audio id="muzik" src="sarki.mp3" preload="none"></audio>
<script>
  const API = "https://uiauqhayjsxywhlabiid.supabase.co/functions/v1/sarki-yanit";
  const SARKI_GIRIS = 11.0;            // şarkı videoda 11. saniyede başlıyor
  const $ = (id) => document.getElementById(id);
  const video = $("video"), muzik = $("muzik"), sahne = $("sahne");
  let soruAcik = false;

  $("basla").onclick = () => {
    $("basla").remove();
    muzik.load();                       // iOS: kullanıcı dokunuşuyla hazırla
    video.play();
    $("atla").hidden = false;
  };

  function soruyuAc() {
    if (soruAcik) return; soruAcik = true;
    // Müzik kesilmesin: şarkıyı videonun kaldığı yerden ayrı ses olarak sürdür.
    const yer = Math.max(0, (video.currentTime || video.duration) - SARKI_GIRIS);
    try { muzik.currentTime = yer; } catch (e) {}
    muzik.play().catch(() => {});
    if (sahne.clientWidth < 640) {           // telefonda formu alta taşı
      const f = $("altForm");
      f.append(document.querySelector(".cevap"), $("gonder"), $("durum"));
      f.classList.add("acik", "soru");
      document.querySelector(".cevap").style.display = "block"; $("gonder").style.display = "block";
    }
    sahne.classList.add("soru");
    $("atla").hidden = true; $("sesKapa").hidden = false;
    setTimeout(() => $("sarki").focus({ preventScroll: true }), 300);
  }
  video.addEventListener("ended", soruyuAc);
  $("atla").onclick = () => { video.currentTime = Math.max(0, video.duration - 0.05); };

  $("sesKapa").onclick = () => {
    if (muzik.paused) { muzik.play(); $("sesKapa").textContent = "Müziği durdur"; }
    else { muzik.pause(); $("sesKapa").textContent = "Müziği aç"; }
  };

  async function gonder() {
    const sarki = $("sarki").value.trim();
    const durum = $("durum");
    if (!sarki) { $("sarki").focus(); return; }
    $("gonder").disabled = true; durum.className = "durum"; durum.style.display = "none";
    try {
      const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sarki }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.hata || "Kaydedilemedi, biraz sonra tekrar dener misin?");
      durum.textContent = "Teşekkürler! Bir şarkı daha ekleyebilirsin.";
      $("sarki").value = "";
    } catch (e) {
      durum.textContent = e.message; durum.classList.add("hata");
    }
    durum.style.display = "block";
    $("gonder").disabled = false;
  }
  $("gonder").onclick = gonder;
  $("sarki").addEventListener("keydown", (e) => { if (e.key === "Enter") gonder(); });
</script>
</body>
</html>
